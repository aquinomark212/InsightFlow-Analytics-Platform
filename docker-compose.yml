services:
  backend:
    build:
      context: ./backend
    command: >
      sh -c "python manage.py migrate &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    networks:
      - app_network
    restart: unless-stopped

  db:
    image: postgres:15
    ports:
      - "5433:5432"     #543 because 5432 is already in use by my local postgres server
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - insight_postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - app_network
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command:
      [
        "python",
        "manage.py",
        "rqworker",
        "events",
        "cache",
        "analytics",
        "notifications",
      ]
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - db
    networks:
      - app_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    #env_file:
    #  - ./frontend/.env
      args:
        NEXT_PUBLIC_API_URL: "/api"
        NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY}
    ports:
      - "3000:80"
    depends_on:
      - backend
    #volumes:
      #- ./frontend:/app
      #- /app/node_modules
    networks:
      - app_network
    restart: unless-stopped

  # nginx:
  #   build: ./nginx
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
  #   depends_on:
  #     - backend
  #   networks:
  #     - app_network
  #   restart: unless-stopped

volumes:
  insight_postgres_data:

networks:
  app_network:
    driver: bridge
