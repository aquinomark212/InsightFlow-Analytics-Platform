services:
  backend:
    build: 
      context: ./backend
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "backend.asgi:application"] 
    env_file:
      - .env
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./backend
    command: ["python", "manage.py", "rqworker", "events", "cache", "analytics", "notifications"]
    env_file:
     - .env
    depends_on:
      - redis

  db: 
    image: postgres:15
    environment:
      POSTGRES_DB: insightflow
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123

  redis:
    image: redis:7

  nginx:
    image: nginx:alpine
    build: 
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

